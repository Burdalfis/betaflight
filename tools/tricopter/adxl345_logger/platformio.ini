[platformio]
default_envs = teensylc

[env]
platform = teensy@6.0.0
platform_packages =
    platformio/framework-arduinoteensy@1.162.0
    platformio/toolchain-gccarmnoneeabi-teensy@1.150201.0
    platformio/tool-teensy@1.162.0
framework = arduino
upload_protocol = teensy-cli
build_flags =
    -D USB_SERIAL
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
    -Wno-deprecated-copy

[env:teensylc]
board = teensylc

; Optional alternatives: same SPI/interrupt pin assignments, native USB serial.
[env:teensy36]
board = teensy36

[env:teensy40]
board = teensy40

; Diagnostic routing test only: DATA_READY goes to the ADXL INT2 output.
; The LC still monitors digital pin 2; the usual environment uses INT1.
[env:teensylc_int2_probe]
extends = env:teensylc
build_flags =
    ${env.build_flags}
    -D LOGGER_ADXL_INT_MAP=0x80

; Electrical diagnostic only: weak 3.3 V pullup on the same input pin.
[env:teensylc_int2_pullup_probe]
extends = env:teensylc
build_flags =
    ${env.build_flags}
    -D LOGGER_ADXL_INT_MAP=0x80
    -D LOGGER_DRDY_PULLUP=1

; Static calibration only: coherent FIFO vectors without DRDY timestamps.
; The existing INT2 wire may remain connected; no DRDY interrupt is enabled.
[env:teensylc_static_fifo]
extends = env:teensylc
build_flags =
    ${env.build_flags}
    -D LOGGER_ADXL_INT_MAP=0x80
    -D LOGGER_STATIC_FIFO=1
