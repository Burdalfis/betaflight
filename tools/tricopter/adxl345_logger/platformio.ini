[platformio]
default_envs = teensylc

[env]
platform = teensy@6.0.0
platform_packages =
    platformio/framework-arduinoteensy@1.162.0
    platformio/toolchain-gccarmnoneeabi-teensy@1.150201.0
    platformio/tool-teensy@1.162.0
framework = arduino
upload_protocol = teensy-cli
build_flags =
    -D USB_SERIAL
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
    -Wno-deprecated-copy

[env:teensylc]
board = teensylc

; Optional alternatives: same SPI/interrupt pin assignments, native USB serial.
[env:teensy36]
board = teensy36

[env:teensy40]
board = teensy40
